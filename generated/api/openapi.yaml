          title: Highorcritical
          type: integer
        minutesProcessed:
          default: 0.0
          title: Minutesprocessed
          type: number
        sessions:
          default: 0
          title: Sessions
          type: integer
        textAnalyzed:
          default: 0
          title: Textanalyzed
          type: integer
        verdicts:
          default: 0
          title: Verdicts
          type: integer
      required:
      - date
      title: AnalyticsDay
    AnalyticsResponse:
      description: '`GET /v1/analytics`.'
      example:
        summary:
          verdicts:
            high: 7
            total: 5
            critical: 6
            low: 1
            medium: 4
          avgRiskScore: 6.027456183070403
          sessions: 1
          languages:
          - count: 4
