components:
  schemas:
    AcceptInvitationRequest:
      example:
        token: token
      properties:
        token:
          minLength: 1
          title: Token
          type: string
      required:
      - token
      title: AcceptInvitationRequest
    AcceptedResponse:
      description: |-
        Deliberately uninformative.

        Returned by register, resend-verification and password-reset whatever the
        outcome, so none of them reveals whether an address has an account.
      example:
        message: message
      properties:
        message:
          title: Message
          type: string
      required:
      - message
      title: AcceptedResponse
    AccountDeleteRequest:
      description: |-
        Confirmation for an irreversible deletion.

        `currentPassword` is optional in the schema and required in practice for any
        account that has one -- an OAuth-only account has no password to check, and
        a schema-level `required` would make the request impossible to satisfy for
        those users. The server decides; see `IdentityService.delete_account`.

        `confirm` must be the literal string `DELETE`. It is not security -- anyone
        who can send the password can send the word -- it is there so that a
        mis-wired client cannot delete an account by calling the wrong endpoint with
        an empty body.
      example:
        confirm: confirm
        currentPassword: currentPassword
      properties:
        confirm:
          description: Must be the literal string "DELETE".
          pattern: ^DELETE$
          title: Confirm
          type: string
        currentPassword:
          maxLength: 1024
          minLength: 1
          nullable: true
          type: string
      required:
      - confirm
      title: AccountDeleteRequest
    AnalysisResponse:
      example:
        voiceAuthenticity:
          assessedSeconds: 5.962133916683182
          syntheticProbability: 0.5637376656633328
          model: model
          status: status
        riskLevel: low
        transcript: transcript
        evidence:
          matchedKeywords:
          - matchedKeywords
          - matchedKeywords
          contextScore: 0.8008281904610115
          languageSupport: languageSupport
          thresholdProfileLanguage: thresholdProfileLanguage
          keywordScore: 6.027456183070403
          language: language
        fraudType: fraudType
        riskScore: 1.4658129805029452
        explanation:
        - explanation
        - explanation
      properties:
        evidence:
          $ref: "#/components/schemas/RiskEvidence"
        explanation:
          items:
            type: string
          type: array
        fraudType:
          nullable: true
          type: string
        riskLevel:
          $ref: "#/components/schemas/RiskLevel"
        riskScore:
          title: Riskscore
          type: number
        transcript:
          nullable: true
          type: string
        voiceAuthenticity:
          $ref: "#/components/schemas/VoiceAuthenticity"
      required:
      - riskLevel
      - riskScore
      title: AnalysisResponse
    AnalyticsDay:
