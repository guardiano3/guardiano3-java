    DecisionEvidence:
      additionalProperties: true
      description: |-
        Supporting detail for the chunk's decision.

        Further keys may appear and may change without notice. Rely only on the
        fields declared here.
      properties:
        chunkCount:
          minimum: 0
          nullable: true
          type: integer
        chunkRiskLevel:
          $ref: "#/components/schemas/RiskLevel"
        chunkScore:
          maximum: 100
          minimum: 0
          nullable: true
          type: number
        corroboratingSignals:
          items:
            type: string
          nullable: true
          type: array
        dominantSessionLanguage:
          nullable: true
          type: string
        languageSupport:
          nullable: true
          type: string
        llmConfidence:
          maximum: 1
          minimum: 0
          nullable: true
          type: number
        llmVerificationExplanation:
          nullable: true
          type: string
        matchedKeywordCount:
          nullable: true
          type: integer
        sessionScore:
          maximum: 100
          minimum: 0
          nullable: true
          type: number
        sttConfidence:
          nullable: true
          type: number
        thresholdProfileLanguage:
          nullable: true
          type: string
        topContextPhrase:
          nullable: true
          type: string
        topContextSimilarity:
          nullable: true
          type: number
        topSessionKeywords:
          items:
            type: string
          nullable: true
          type: array
      title: DecisionEvidence
    DecisionFrame:
      description: |-
        A scored chunk. If `verificationStatus` is `pending`, a `decisionUpdate`
        for the same chunk will follow -- do not treat `pending` as final.
      properties:
        evidence:
          $ref: "#/components/schemas/DecisionEvidence"
        explanation:
          items:
            type: string
          type: array
        fraudCategory:
          $ref: "#/components/schemas/FraudCategory"
        fraudConfidence:
          maximum: 1
          minimum: 0
          nullable: true
          type: number
        fraudType:
          nullable: true
          type: string
        latencyMs:
          nullable: true
          type: number
        processedAt:
          format: date-time
          nullable: true
          type: string
        riskLevel:
          $ref: "#/components/schemas/RiskLevel"
        riskScore:
          maximum: 100
          minimum: 0
          nullable: true
          type: number
        sessionId:
          title: Sessionid
          type: string
        speechRate:
          nullable: true
          type: integer
        stress:
          nullable: true
          type: integer
        transcript:
          nullable: true
          type: string
        type:
          default: decision
          enum:
          - decision
          title: Type
          type: string
        urgency:
          nullable: true
          type: number
        verificationStatus:
          $ref: "#/components/schemas/VerificationStatus"
