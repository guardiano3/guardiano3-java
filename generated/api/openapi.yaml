          textAnalyzed: 1
          daily:
          - date: date
            verdicts: 3
            sessions: 7
            highOrCritical: 5
            textAnalyzed: 9
            audioAnalyzed: 5
            minutesProcessed: 2.3021358869347655
          - date: date
            verdicts: 3
            sessions: 7
            highOrCritical: 5
            textAnalyzed: 9
            audioAnalyzed: 5
