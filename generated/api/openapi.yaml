    DecisionUpdateFrame:
      description: |-
        The final decision for a chunk first sent with `verificationStatus:
        pending`. Replace the earlier `decision` for that chunk in place rather
        than appending a duplicate; its values, including `riskLevel`, supersede
        the provisional ones.
      properties:
        evidence:
          $ref: "#/components/schemas/DecisionEvidence"
        explanation:
          items:
            type: string
          type: array
        fraudCategory:
          $ref: "#/components/schemas/FraudCategory"
        fraudConfidence:
          maximum: 1
          minimum: 0
          nullable: true
          type: number
        fraudType:
          nullable: true
          type: string
        latencyMs:
          nullable: true
          type: number
        processedAt:
          format: date-time
          nullable: true
          type: string
        riskLevel:
          $ref: "#/components/schemas/RiskLevel"
        riskScore:
          maximum: 100
          minimum: 0
          nullable: true
          type: number
        sessionId:
          title: Sessionid
          type: string
        speechRate:
          nullable: true
          type: integer
        stress:
          nullable: true
          type: integer
        transcript:
          nullable: true
          type: string
        type:
          default: decisionUpdate
          enum:
          - decisionUpdate
          title: Type
          type: string
        urgency:
          nullable: true
          type: number
        verificationStatus:
          $ref: "#/components/schemas/VerificationStatus"
        voiceAuthenticity:
          $ref: "#/components/schemas/VoiceAuthenticity"
      required:
      - riskLevel
      - sessionId
      title: DecisionUpdateFrame
    DegradedFrame:
      description: |-
        Part of the audio was not analysed. The session goes on.

        Sent on the decision stream when a stretch of audio could not be
        transcribed, or transcription timed out. That stretch produced no decision, so a quiet stream
        must not be read as "nothing suspicious was said". Treat the verdict as
        incomplete while these arrive: escalate on your own rules (for example,
        fall back to your existing controls) rather than on a missing alert.

        Not an ``ErrorFrame``: that one precedes a close; this one does not.
      properties:
        reason:
          $ref: "#/components/schemas/DegradedReason"
        sessionId:
          title: Sessionid
          type: string
        totalUnheardSeconds:
          description: "Audio not analysed so far in this session, cumulative."
          minimum: 0
          title: Totalunheardseconds
          type: number
        type:
          default: degraded
          enum:
          - degraded
          title: Type
          type: string
        unheardSeconds:
          description: Audio in this stretch that was not analysed.
          minimum: 0
          title: Unheardseconds
          type: number
      required:
      - reason
      - sessionId
      - totalUnheardSeconds
      - unheardSeconds
      title: DegradedFrame
    DegradedReason:
      enum:
      - transcription_failed
      - transcription_timeout
      title: DegradedReason
      type: string
    EmailChangeRequest:
      example:
        newEmail: newEmail
        currentPassword: currentPassword
      properties:
        currentPassword:
          maxLength: 1024
          minLength: 1
          title: Currentpassword
          type: string
