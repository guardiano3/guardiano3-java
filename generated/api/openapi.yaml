      - createdAt
      - environment
      - id
      - name
      - prefix
      - scopes
      title: ApiKeyResponse
    ApiKeyRotateRequest:
      example:
        graceHours: 13
      properties:
        graceHours:
          default: 0
          maximum: 168.0
          minimum: 0.0
          title: Gracehours
          type: integer
      title: ApiKeyRotateRequest
    AuthFrame:
      description: |-
        The first text frame on either channel.

        Browsers cannot set headers on a WebSocket upgrade, so the credential
        travels here instead. The value is self-describing: an API key
        (``go3_…``) or a user access token, told apart by the prefix exactly as on
        REST. No separate field says which -- one that could disagree with the
        value would be a second source of truth.
      properties:
        token:
          description: "A user access token, or an API key carrying the scope this\
            \ channel requires."
          title: Token
          type: string
      required:
      - token
      title: AuthFrame
    AuthSessionResponse:
      description: |-
        A signed-in session (a device), not an analysis session.

        Named to disambiguate from `product.SessionResponse`, which is an analysis
        session. Two Pydantic classes sharing a name is invisible on the server but
        produces `SchemasV1AuthSessionResponse` as a generated SDK type -- the
        contract's names are part of its public surface.
      example:
        createdAt: 2000-01-23T04:56:07.000+00:00
        current: false
        lastUsedAt: 2000-01-23T04:56:07.000+00:00
        ip: ip
        userAgent: userAgent
        id: id
        expiresAt: 2000-01-23T04:56:07.000+00:00
      properties:
        createdAt:
          format: date-time
          title: Createdat
          type: string
        current:
          default: false
          title: Current
          type: boolean
        expiresAt:
          format: date-time
          title: Expiresat
          type: string
        id:
          title: Id
          type: string
        ip:
          nullable: true
          type: string
        lastUsedAt:
          format: date-time
          nullable: true
          type: string
        userAgent:
          nullable: true
          type: string
      required:
      - createdAt
      - expiresAt
      - id
      title: AuthSessionResponse
    Body_analyze_audio_v1_analyze_audio_post:
      properties:
        file:
          format: binary
          title: File
          type: string
        language:
          nullable: true
          type: string
      required:
      - file
      title: Body_analyze_audio_v1_analyze_audio_post
    ContactSalesRequest:
