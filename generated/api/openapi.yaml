openapi: 3.1.0
info:
  contact:
    email: support@guardiano3.com
    name: GuardianO3 Support
  description: |-
    Real-time scam detection for audio and text.

    Authenticate with a user access token or an API key; both are sent as `Authorization: Bearer <value>` and are distinguished by the `go3_` key prefix.

    Errors share one envelope -- branch on `error.code`, never on `error.message`. Every response carries `X-Request-Id`; quote it in bug reports.

    **Live session channels** (`/v1/sessions/{session_id}/audio` and `/v1/sessions/{session_id}/stream`) use WebSocket, not HTTP. They are not listed under `paths` because OpenAPI 3.x has no first-class WebSocket support; their frame shapes and close codes are declared in the `x-websockets` extension at the top level of this document.
  license:
    name: Apache-2.0
  termsOfService: https://guardiano3.com/terms
  title: GuardianO3 API
  version: 1.0.0
servers:
- description: Production
  url: https://api.guardiano3.com
paths:
  /v1/analytics:
    get:
      description: "Sessions, analyses, verdicts and audio minutes for a rolling window.\
        \ Organization-wide for organization members; your own otherwise. `environment=live`\
        \ counts live API keys; `environment=test` counts test keys and the console\
        \ sandbox. The two are never combined. Requires a signed-in user; API keys\
        \ are not accepted."
      operationId: get_analytics_v1_analytics_get
      parameters:
      - description: "Rolling window, ending now."
        explode: true
        in: query
        name: window
        required: false
        schema:
          default: 30d
          description: "Rolling window, ending now."
          enum:
          - 24h
          - 7d
          - 30d
          - 90d
          - 365d
          title: Window
          type: string
        style: form
      - explode: true
        in: query
        name: environment
        required: false
        schema:
          default: live
          enum:
          - live
          - test
          title: Environment
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsResponse"
          description: Successful Response
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The request was well-formed but rejected -- an expired or\
            \ already-used token, or a value the schema cannot constrain."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Authentication is missing, invalid, or revoked."
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Authenticated, but not permitted (role, scope, or environment)."
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "A state conflict -- the resource already exists, or an Idempotency-Key\
            \ was reused with a different body."
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The request failed validation.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Rate limit or quota exceeded. See Retry-After.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected server error.
      security:
      - HTTPBearer: []
      summary: Your organization's analytics
      tags:
      - v1-account
      x-audience: console
      x-accepts:
      - application/json
  /v1/analyze/audio:
    post:
      description: |-
        Requires the `analysis:write` scope. Uploads are capped at `ANALYZE_MAX_UPLOAD_BYTES` and must carry an audio content type. Clips longer than `ANALYZE_MAX_AUDIO_SECONDS` (120 s by default) are refused with `413`, not truncated -- send the part of the audio to be scored, or stream live audio over the session WebSockets in real time. WAV, MP3, FLAC, OGG, MP4/M4A and WebM are decoded and resampled server-side; a file that cannot be decoded is refused with `415`. If transcription fails the response is `502` (or `504` on a timeout) -- never a low-risk verdict on audio that was not heard.

        `Idempotency-Key` is **not** supported here: fingerprinting the payload would mean holding and hashing the whole upload a second time, which doubles the memory cost of the largest request the API accepts. Retry safety for audio comes from the request being stateless -- the audio is not persisted, so a duplicate costs a re-analysis (and counts as a second analysis in analytics), not a duplicate record of the audio.
      operationId: analyze_audio_v1_analyze_audio_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/Body_analyze_audio_v1_analyze_audio_post"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResponse"
          description: Successful Response
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The request was well-formed but rejected -- an expired or\
            \ already-used token, or a value the schema cannot constrain."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Authentication is missing, invalid, or revoked."
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Authenticated, but not permitted (role, scope, or environment)."
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "A state conflict -- the resource already exists, or an Idempotency-Key\
            \ was reused with a different body."
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The request failed validation.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Rate limit or quota exceeded. See Retry-After.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unexpected server error.
      security:
      - HTTPBearer: []
      summary: Transcribe and score an audio clip
      tags:
      - v1-analysis
      x-audience: public
      x-content-type: multipart/form-data
      x-accepts:
      - application/json
