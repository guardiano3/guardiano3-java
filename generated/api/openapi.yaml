    ApiKeyResponse:
      description: Metadata. Never contains the secret.
      example:
        createdAt: 2000-01-23T04:56:07.000+00:00
        environment: environment
        lastUsedAt: 2000-01-23T04:56:07.000+00:00
        prefix: prefix
        rotatedToId: rotatedToId
