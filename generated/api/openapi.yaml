          type: string
        scopes:
          items:
            type: string
          nullable: true
          type: array
      required:
      - name
      title: ApiKeyCreateRequest
    ApiKeyCreatedResponse:
      description: |-
        Returned once, at creation.

        `key` is the only time the secret is transmitted. It is stored as a SHA-256
        digest and cannot be recovered; a caller who loses it rotates.
      example:
        apiKey:
          createdAt: 2000-01-23T04:56:07.000+00:00
          environment: environment
          lastUsedAt: 2000-01-23T04:56:07.000+00:00
          prefix: prefix
          rotatedToId: rotatedToId
          name: name
          id: id
          scopes:
          - scopes
          - scopes
          revokedAt: 2000-01-23T04:56:07.000+00:00
          expiresAt: 2000-01-23T04:56:07.000+00:00
        key: key
      properties:
        apiKey:
          $ref: "#/components/schemas/ApiKeyResponse"
        key:
          description: The secret. Shown once and never again.
          title: Key
          type: string
      required:
      - apiKey
      - key
      title: ApiKeyCreatedResponse
    ApiKeyListResponse:
      example:
        items:
        - createdAt: 2000-01-23T04:56:07.000+00:00
          environment: environment
          lastUsedAt: 2000-01-23T04:56:07.000+00:00
          prefix: prefix
