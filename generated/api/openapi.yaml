        \ (`go3_live_...` / `go3_test_...`). Both are sent the same way and are told\
        \ apart by the key prefix."
      scheme: bearer
      type: http
x-audiences:
  console: "Requires a signed-in user. Creating and managing API keys, the account's\
    \ own identity and profile, usage stats, and policy acceptance. What a developer\
    \ does in the developer console; not what their integration calls."
  public: "Callable with an API key. The surface an integration is built on: analysis,\
