    Error_error_details_inner:
      example:
        field: field
        issue: issue
      properties:
        field:
          type: string
        issue:
          type: string
    Error_error:
      example:
        code: NOT_FOUND
        docsUrl: https://guardiano3.com/docs/errors#not_found
        requestId: req_9f3a2c8e11bb4d7a8e5c1f0b2d6a4e93
        details:
        - field: field
          issue: issue
        - field: field
          issue: issue
        message: No such session.
      properties:
        code:
          description: "Stable, machine-readable error code. Branch on this, never\
            \ on `message`. Unknown codes may be added without a version bump, so\
            \ clients must fall back on the HTTP status class."
          example: NOT_FOUND
          type: string
        details:
          description: "Per-field validation failures, when applicable."
          items:
            $ref: "#/components/schemas/Error_error_details_inner"
          type: array
        docsUrl:
          description: Deep link to the error-code entry in the published errors reference.
            Present only when the deployment has `ERROR_DOCS_BASE_URL` configured;
            omitted otherwise rather than sent blank.
          example: https://guardiano3.com/docs/errors#not_found
          type: string
        message:
          description: "Human-readable. Not contract: may be reworded at any time."
          example: No such session.
          type: string
        requestId:
          description: Also returned as the X-Request-Id header. Quote it in bug reports.
          example: req_9f3a2c8e11bb4d7a8e5c1f0b2d6a4e93
          type: string
      required:
      - code
      - message
  securitySchemes:
    HTTPBearer:
