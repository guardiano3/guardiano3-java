        environment:
          default: live
          pattern: ^(live|test)$
          title: Environment
          type: string
        expiresInDays:
          maximum: 3650.0
          minimum: 1.0
          nullable: true
          type: integer
        name:
          maxLength: 128
          minLength: 1
