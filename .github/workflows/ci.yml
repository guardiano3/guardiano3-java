name: CI

# Pull requests into main, and release.yml before it publishes. Validate
# locally before opening a pull request.
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  drift:
    # The committed generated module must be exactly what openapi/v1.json
    # produces. A hand edit to it, or a contract change without regenerating,
    # fails here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/generate.sh
      - name: Generated code matches the contract
        run: |
          if [ -n "$(git status --porcelain -- generated)" ]; then
            echo "::error::generated/ does not match openapi/v1.json. Run ./scripts/generate.sh and commit the result."
            git status --short -- generated | head -50
            exit 1
          fi

  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_readme.py

  build:
    # `verify` compiles both modules, runs both test suites, and builds the
    # main, sources and javadoc jars -- the javadoc build fails on broken
    # doc comments, which Maven Central would otherwise be the first to find.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest supported LTS and the newest.
        java-version: ["11", "25"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven
      - run: mvn -B -ntp verify

  dco:
    # Every commit carries a Signed-off-by line from its author. See
    # CONTRIBUTING.md in guardiano3/.github. Pull requests only: a release
    # builds a commit that already passed this on its way into main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$c")"
            if ! git log -1 --format=%B "$c" | grep -qF "Signed-off-by: $author"; then
              echo "::error::$(git log -1 --format='%h %s' "$c") is not signed off by $author (git commit -s)"
              bad=1
            fi
          done
          exit $bad
